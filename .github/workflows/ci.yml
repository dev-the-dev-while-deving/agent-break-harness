name: harness
on:
  push:
  pull_request:
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run golden suite
        run: python -m harness run
        # Attack fails are the product (reusable failure modes).
        # This job fails only if the harness itself crashes.
